# Configuración del worker hermes_brain.
# Cópiala a  C:\Users\Usuario\.config\harness\hermes_brain.yaml
# (o exporta HERMES_BRAIN_CONFIG con otra ruta) y ajusta lo marcado con  <-- AJUSTAR.

# --- Qué recorrer -----------------------------------------------------------
# La carpeta se indica en cada corrida, porque cambia cada vez:
#     python hermes_brain.py correr --carpeta "C:/Users/Usuario/OneDrive/Papers"
# Sin --carpeta y sin nada aquí, el worker la pregunta. Deja esta lista vacía salvo que
# recorras siempre las mismas carpetas; lo que pongas aquí es solo el valor por defecto.
carpetas: []

extensiones: [".pdf", ".docx", ".doc"]
excluir: ["~$*", ".*", "_adjuntos", "Thumbs.db"]   # temporales de Word, ocultos, salidas propias
tamano_max_mb: 200
concurrencia: 1        # chats de Hermes en paralelo. 1 si el modelo corre local en este PC.
# OneDrive «Archivos a petición»: los archivos que están solo en la nube se saltan y se
# cuentan, porque hashearlos fuerza la descarga completa. Ponlo en true solo si quieres que
# el worker los descargue al pasar.
procesar_solo_en_la_nube: false

# --- Dónde dejar los .md ----------------------------------------------------
destino_md: "C:/Users/Usuario/OneDrive/brain md"
adjuntos: "_adjuntos"                 # subcarpeta de figuras dentro de destino_md
deidentificar: true                    # enmascara RUT/nombres/teléfonos al convertir Word

# --- Estado local -----------------------------------------------------------
db: "C:/Users/Usuario/.hermes_brain/cola.sqlite3"
python: ""                             # intérprete para el script de conversión ("" = el actual)
script_docx_md: "C:/Users/Usuario/harness/skills/resumen_clinico_md/scripts/docx_a_md.py"

# --- Hermes agent (CLI local) ----------------------------------------------
# Un proceso = un chat: el modo oneshot (-z) abre una sesión, responde y termina.
# Marcadores: {archivo} {skill} {prompt} {prompt_file} {destino} {adjuntos} {slug} {salida_json}
hermes:
  # Calibrado contra el --help real de hermes.exe. Ojo con lo que ese CLI *no* tiene:
  #   · no hay bandera de adjunto  → la ruta del archivo viaja dentro del texto del prompt
  #   · no hay bandera de salida JSON → el resultado se lee de la última línea de stdout
  # El worker ya construye los prompts contando con ambas cosas.
  comando:
    - "C:/Users/Usuario/AppData/Local/hermes/hermes-agent/venv/Scripts/hermes.exe"
    - "-s"
    - "{skill}"          # -s / --skills : precarga la skill para esta sesión
    - "-z"
    - "{prompt}"         # -z / --oneshot : un solo prompt, imprime solo la respuesta final
  comando_cierre: []                   # el proceso termina solo: no hace falta cerrar nada
  timeout_s: 900                       # tope por archivo; al vencerse mata el árbol de procesos
  reintentos: 2
  espera_reintento_s: 20
  cwd: null
  env: {}
  skill_pdf: "analisis-estudio"        # <-- CONFIRMAR el nombre exacto de la skill
  skill_docx: "resumen-clinico-md"     # <-- CONFIRMAR (o déjala fuera, ver abajo)

  # Word clínico: la conversión .docx → .md es determinista y no necesita un agente.
  # Con `true` (por defecto) la hace el worker y Hermes solo revisa el .md resultante; si
  # Hermes falla, el .md con sus figuras ya está escrito. Con `false`, es Hermes quien
  # ejecuta el conversor, lo que exige que su CLI pueda correr comandos.
  convertir_docx_en_worker: true
  revisar_docx_con_hermes: true        # false = conversión pura, sin abrir chat para Word

  # Prompts propios (opcionales). Vacíos = los del worker, que ya piden la línea JSON final.
  prompt_pdf: ""
  prompt_docx: ""

# --- Umbrales del clasificador ---------------------------------------------
# Entre "no" y "sí" está la zona gris: esos archivos quedan como dudosos para la revisión
# final. Sube docx_umbral_si si te llegan demasiados falsos positivos clínicos.
clasificador:
  pdf_umbral_si: 4.0
  pdf_umbral_no: 2.0
  docx_umbral_si: 4.0
  docx_umbral_no: 2.0
  paginas_pdf: 2                       # páginas leídas para decidir
  palabras_docx: 1200
  convertir_doc_con_soffice: false     # true si tienes LibreOffice y quieres procesar .doc
  soffice: "soffice"

# --- n8n (VPS) --------------------------------------------------------------
# Deja base_url vacío para trabajar sin VPS: todo funciona igual, solo sin panel remoto.
n8n:
  base_url: "https://n8n.tudominio.cl/webhook"     # <-- AJUSTAR (sin barra final)
  token: "${HERMES_TOKEN}"                          # el mismo valor que HERMES_TOKEN en n8n
  timeout_s: 30
  lote_resultados: 25                  # registros por envío
  enviar_nombres: false                # true filtra nombres de archivo al VPS: no lo actives con PHI
  verificar_tls: true
